<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="952" viewBox="0 0 1000 952" role="img" aria-label="Lair area schematic"><style>text{font-family:Segoe UI,Arial,sans-serif;font-size:16px;fill:rgb(26,28,31)}.secondary{fill:rgb(139,140,142)}.map-label{paint-order:stroke;stroke:rgb(255,255,255);stroke-width:5px;stroke-linejoin:round}</style><rect width="1000" height="952" fill="rgb(255,255,255)"/><text x="24" y="28" font-weight="500">Lair area — working schematic</text><text x="24" y="52">North up · not to scale · exact placements provisional</text><g transform="translate(0,70)"><title id="vbl-map-title">The river and the three lair approaches</title><desc id="vbl-map-desc">A proposed north-up schematic. Orenlas lies off-map to the east, about 130 miles away. The direct route crosses the altered river and reaches an overlook east of three closely grouped peaks and central workshops. Vraedhul, A, is southwest; Krauzeth, B, is northwest; Zaurmath, C, is east. The grand road leads to A, sheltered tracks lead to B, and the ruined approach leads to C. An ordinary upstream crossing gives access to a northern danger zone occupied by roaming chaos-elemental packs. Downstream conditions worsen. Exact positions and local distances are provisional.</desc><polygon points="75,79.2 205,58.5 405,67.5 610,91.8 594,185.4 490,222.3 305,203.4 132,196.2 75,79.2" fill="rgb(224,46,42)" fill-opacity=".07" stroke="rgb(224,46,42)" stroke-opacity=".5" stroke-width="1.4" stroke-dasharray="5 6"></polygon><text x="340" y="117" text-anchor="middle" class="map-label"><tspan x="340" dy="0">Northern danger zone</tspan><tspan x="340" dy="1.3em">Roaming chaos-elemental packs</tspan></text><path d="M175,163.8 L260,171 L290,160.2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="rgb(224,46,42)" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="3 6"></path><path d="M420,172.8 L473,182.7 L519,166.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="rgb(224,46,42)" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="3 6"></path><polygon points="638,208.8 695,205.2 720,279 715,360.9 681,388.8 641,347.4 625,271.8 638,208.8" fill="rgb(51,156,255)" fill-opacity=".07" stroke="rgb(237,237,237)" stroke-width="1"></polygon><path d="M640,225.9 L635,277.2 L654,352.8" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="rgb(51,156,255)" stroke-opacity=".35" stroke-width="1.5"></path><path d="M655,225.9 L651,277.2 L667,352.8" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="rgb(51,156,255)" stroke-opacity=".35" stroke-width="1.5"></path><path d="M670,225.9 L667,277.2 L680,352.8" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="rgb(51,156,255)" stroke-opacity=".35" stroke-width="1.5"></path><path d="M685,225.9 L683,277.2 L693,352.8" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="rgb(51,156,255)" stroke-opacity=".35" stroke-width="1.5"></path><polygon points="679,504 749,509.4 854,679.5 755,702 685,596.7 679,504" fill="rgb(224,46,42)" fill-opacity=".06" stroke="rgb(224,46,42)" stroke-opacity=".35" stroke-width="1" stroke-dasharray="3 6"></polygon><path d="M680,22.5 L658,108 L676,198 L666,292.5 L690,394.2 L691,450 L725,545.4 L776,634.5 L805,694.8" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="rgb(51,156,255)" stroke-width="11" stroke-opacity=".65"></path><path d="M682,58.5 L678,76.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="rgb(51,156,255)" stroke-width="1.5"></path><polygon points="678,82.8 672,72.9 684,74.7" fill="rgb(51,156,255)"></polygon><text x="704" y="39.6" text-anchor="start" class="map-label"><tspan x="704" dy="0">River · downstream ↓</tspan></text><text x="739" y="265.5" text-anchor="start" class="map-label"><tspan x="739" dy="0">Solid air</tspan><tspan x="739" dy="1.3em">thickens here</tspan></text><text x="812" y="589.5" text-anchor="middle" class="map-label"><tspan x="812" dy="0">Downstream chaos</tspan><tspan x="812" dy="1.3em">Water + air hazards*</tspan></text><path d="M952,450.9 L842,450.9 L742,450 L692,450 L600,450" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="rgb(226,85,7)" stroke-width="3"></path><path d="M804,445.5 L800,334.8 L786,222.3 L734,108.9 L658,108 L537,100.8 L489,207.9" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="rgb(226,85,7)" stroke-width="2.5" stroke-dasharray="7 6"></path><polygon points="489,214.2 482,201.6 497,205.2" fill="rgb(226,85,7)"></polygon><text x="947" y="404.1" text-anchor="end" class="map-label"><tspan x="947" dy="0">From Orenlas</tspan><tspan x="947" dy="1.3em">~130-mile expedition</tspan></text><text x="799" y="146.7" text-anchor="start" class="map-label"><tspan x="799" dy="0">Upriver detour</tspan></text><path d="M600,450 L535,522 L365,526.5 L280,495 L258,445.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="rgb(139,140,142)" stroke-width="1.8"></path><path d="M600,450 L540,407.7 L513,297 L380,272.7 L312,335.7" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="rgb(139,140,142)" stroke-width="1.6" stroke-dasharray="3 5"></path><path d="M600,450 L525,423 L467,383.4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="rgb(139,140,142)" stroke-width="1.6"></path><text x="375" y="553.5" text-anchor="middle" class="map-label"><tspan x="375" dy="0">Crooked grand road</tspan></text><text x="430" y="254.7" text-anchor="middle" class="map-label"><tspan x="430" dy="0">Sheltered tracks</tspan></text><polygon points="245,367.2 285,306.9 325,367.2" fill="rgb(232,232,233)" fill-opacity=".6" stroke="rgb(26,28,31)" stroke-width="1.5"></polygon><polygon points="181,460.8 225,398.7 270,460.8" fill="rgb(232,232,233)" fill-opacity=".6" stroke="rgb(26,28,31)" stroke-width="1.5"></polygon><polygon points="389,396 430,333.9 475,396" fill="rgb(232,232,233)" fill-opacity=".6" stroke="rgb(26,28,31)" stroke-width="1.5"></polygon><text x="225" y="443.7" text-anchor="middle" class="map-label"><tspan x="225" dy="0">A</tspan></text><text x="285" y="349.2" text-anchor="middle" class="map-label"><tspan x="285" dy="0">B</tspan></text><text x="430" y="379.8" text-anchor="middle" class="map-label"><tspan x="430" dy="0">C</tspan></text><polygon points="298,377.1 340,368.1 374,390.6 361,428.4 312,427.5 298,377.1" fill="rgb(146,79,247)" fill-opacity=".1" stroke="rgb(146,79,247)" stroke-opacity=".5" stroke-width="1" stroke-dasharray="4 4"></polygon><text x="336" y="405.9" text-anchor="middle" class="map-label"><tspan x="336" dy="0">W</tspan></text><text x="225" y="487.8" text-anchor="middle" class="map-label"><tspan x="225" dy="0">Vraedhul</tspan></text><text x="285" y="285.3" text-anchor="middle" class="map-label"><tspan x="285" dy="0">Krauzeth</tspan></text><text x="430" y="319.5" text-anchor="middle" class="map-label"><tspan x="430" dy="0">Zaurmath</tspan></text><text x="343" y="454.5" text-anchor="middle" class="map-label"><tspan x="343" dy="0">Workshops</tspan></text><circle cx="691" cy="450" r="14" fill="rgb(255,255,255)" stroke="rgb(226,85,7)" stroke-width="2"></circle><text x="691" y="450" text-anchor="middle" class="" dy=".35em"><tspan x="691" dy="0">R</tspan></text><circle cx="658" cy="108" r="14" fill="rgb(255,255,255)" stroke="rgb(226,85,7)" stroke-width="2"></circle><text x="658" y="108" text-anchor="middle" class="" dy=".35em"><tspan x="658" dy="0">U</tspan></text><text x="648" y="488.7" text-anchor="middle" class="map-label"><tspan x="648" dy="0">Altered crossing</tspan></text><text x="639" y="57.6" text-anchor="middle" class="map-label"><tspan x="639" dy="0">Upstream crossing</tspan></text><circle cx="600" cy="450" r="4" fill="rgb(26,28,31)"></circle><text x="566" y="432" text-anchor="end" class="map-label"><tspan x="566" dy="0">Overlook</tspan></text><text x="531" y="652.5" text-anchor="end" class="secondary"><tspan x="531" dy="0">*Aerial current is a proposal.</tspan></text><text x="33" y="36.9" text-anchor="middle" class=""><tspan x="33" dy="0">N</tspan></text><path d="M33,65.7 L33,47.7" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="rgb(26,28,31)" stroke-width="1.3"></path><polygon points="33,43.2 28,52.2 38,52.2" fill="rgb(26,28,31)"></polygon><text x="33" y="695.7" text-anchor="start" class="secondary"><tspan x="33" dy="0">Surface relationships only · interior routes omitted</tspan></text></g><text x="24" y="822">A · Vraedhul — formal entrance</text><text x="514" y="822">B · Krauzeth — guarded entrance</text><text x="24" y="849">C · Zaurmath — ruined entrance</text><text x="514" y="849">W · Workshops — unforming</text><text x="24" y="876">R · Altered crossing — folded current</text><text x="514" y="876">U · Upstream crossing — northern detour</text><line x1="24" x2="66" y1="917" y2="917" stroke="rgb(226,85,7)" stroke-width="3"/><text x="75" y="922">Direct approach</text><line x1="270" x2="312" y1="917" y2="917" stroke="rgb(226,85,7)" stroke-width="3" stroke-dasharray="7 6"/><text x="321" y="922">Upstream alternative</text><line x1="585" x2="627" y1="917" y2="917" stroke="rgb(139,140,142)" stroke-width="2"/><text x="636" y="922">Entrance approaches</text></svg>

name: Secret filter safety

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test secret filter
        run: python3 -B _scripts/test_secret_filter.py
      - name: Check committed tree
        run: python3 -B _scripts/secret_filter.py check-tree HEAD

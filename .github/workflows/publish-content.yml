name: Publish vault content

# Run manually, or push a unique tag such as publish/2026-10-24.
# Setup: _scripts/PUBLISH_CONTENT.txt
on:
  workflow_dispatch:
  push:
    tags: ['publish/*']

permissions:
  contents: read

# Let active uploads/activation finish. The publisher's D1 lock also guards
# against a simultaneous local publisher or a publisher in another repository.
concurrency:
  group: taelgar-content-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: core
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
    steps:
      - name: Check out the selected vault revision and all media
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: taelgar
          persist-credentials: false
      - name: Check out the publisher from core main
        uses: actions/checkout@v6
        with:
          repository: msackton/taelgarverse-core
          ref: main
          path: core
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: core/package-lock.json
      - name: Record source revisions
        run: |
          {
            echo '### Content publication sources'
            echo "Vault: $(git -C ../taelgar rev-parse HEAD)"
            echo "Publisher (main): $(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - name: Publish content and search to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLISH_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Configure CLOUDFLARE_PUBLISH_API_TOKEN (Actions secret) and CLOUDFLARE_ACCOUNT_ID (Actions variable) in taelgar. See _scripts/PUBLISH_CONTENT.txt.'
            exit 1
          fi
          npm run publish -- --vault ../taelgar --no-strict
      - name: Retain publication reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: publication-reports-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            core/.cache/publish/materialization-report.json
            core/.cache/publish/conversion-report.json
            core/.cache/publish/search-receipt.json
            core/.cache/publish/checkpoint.json
            core/.cache/publish/latest.json
            core/.cache/publish/timings.json

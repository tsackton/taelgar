schema_version: 1
annotated_date: '2026-11-06'
basis: Enemy rosters derived from existing combat encounter titles, opening actions, actor labels, resolved
  action summaries, endings and qualifications. These are analysis annotations for review.
conventions:
- Lists include enemies that are asleep, incapacitated, controlled or defeated before acting when the source
  establishes their participation.
- Named opponents and descriptive forms are preserved as played. Published stat blocks are not inferred.
- Counts appear in labels only when supported. Role and positional aliases are grouped where identities overlap.
- Enemy summons and minions are included. Party allies, controlled constructs and summons are excluded from
  enemy lists. Changes of allegiance are explained in notes.
- The same creature can appear in successive encounter rows. These lists do not establish unique campaign-wide
  creature counts.
- Friendly duels, PC conflicts and environmental opposition have separate other_opposition entries.
- Hostile objects, effects and encounter objectives are placed in other_opposition or explained in notes.

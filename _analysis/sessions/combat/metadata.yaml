encounter_qualifications:
  dunmari-frontier-104/c001:
    kind: remote_observation
    include_speed: false
    reason: 'The party watches through scrying. The fight is already underway, so only the observed portion is recorded.'
  dunmari-frontier-104/c002:
    kind: extended_action_cycles
    include_speed: false
    reason: 'Recorded cycles include ten-minute Radiance holds. The denominator does not represent ordinary combat rounds.'
  dunmari-frontier-064/c001:
    kind: environmental_challenge
    include_speed: true
    reason: 'Ordered action cycles resolve passage through the vortex. Retained under the current combat classification.'
  into-the-chasm-006/c001:
    kind: compelled_pc_intervention
    include_speed: true
    reason: 'One initiative cycle stops a compelled descent. Retained under the current combat classification.'
  into-the-chasm-006/c002:
    kind: evacuation
    include_speed: true
    reason: 'Repeated ordered actions resolve the evacuation. Closing cycles are compressed in narration.'
  dunmari-frontier-075/c002:
    kind: pc_conflict
    include_speed: true
    reason: 'A genuine one-minute initiative exchange resolves Kenzo striking Wellby. Retained under the current combat classification.'
  dunmari-frontier-043/c001:
    kind: initiative_standoff
    include_speed: true
    reason: 'Initiative orders a horn signal and intimidation. The scouts flee or surrender after about two minutes.'
session_qualifications:
  labyrinths-of-the-lost-002: 'The transcript acknowledges a missing post-break recording. The session note describes an additional ruined-library fight. Session duration, combat time, and encounter count cover surviving recorded play only.'
  dunmari-frontier-116: 'The timing repair was already present when this analysis began. The second recording is offset by 4:07:01.760. The analysis reads the registered continuous source directly.'
source_audit:
  date: '2026-11-06'
  method: 'Read polished transcript turns around the classified start and end, including adjacent turns, for these extremes and ordinary comparison cases. Retain the owning extraction and its round grouping.'
  reviewed_encounters:
    - dunmari-frontier-075/c002
    - dunmari-frontier-043/c001
    - dunmari-frontier-011/c001
    - dunmari-frontier-078/c001
    - dunmari-frontier-102/c001
    - dunmari-frontier-112/c002
    - dunmari-frontier-133/c001
    - dunmari-frontier-136/c003
    - dunmari-frontier-138/c001
    - dunmari-frontier-065/c001
    - dunmari-frontier-097/c001
    - dunmari-frontier-104/c002
    - labyrinths-of-the-lost-002/c002
    - mawar-adventures-003/c001
  findings:
    - 'The shortest exchange, Kenzo striking Wellby, is supported by an initiative roll and a resolved hit.'
    - 'The bandit standoff ends promptly with flight or surrender after ordered intimidation.'
    - 'The longest fight, Kadmos at the palace, runs from initiative setup to the explicit end of initiative.'
    - 'The highest minutes-per-round case, the Buruli escape, spans both planes until the DM drops action order.'
    - 'Large late-campaign fights include continuous phases, extra actors or an immediate rescue within their retained combat boundaries.'
    - 'All 156 timed-session recording extents and combat totals match their current structured review within one second of displayed rounding.'
matched_comparison:
  days_either_side: 180
  require_same_level: true
  require_same_pc_turn_count: true
  note: 'For each gathering and level, compare with Zoom fights within 180 days, using the same number of roster PCs explicitly taking regular turns. Exclude the split adventures from this comparison. A missing comparison group remains unavailable.'
